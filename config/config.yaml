# Frontier Explorer Configuration

# Navigation parameters
frontier_search_radius: 5.0  # Maximum distance (meters) to search for frontiers from current position
goal_offset_distance: 0.5    # Distance (meters) to offset goal inside free space from frontier boundary

# Frontier detection parameters
min_frontier_size: 10        # Minimum number of contiguous unexplored cells to consider valid frontier

# Velocity limits
max_translation_speed: 0.2   # Maximum linear velocity (m/s)
max_rotation_speed: 0.5      # Maximum angular velocity (rad/s)

# Navigation mode
nav_to_target: false        # If true, automatically navigate to selected frontiers. If false, visualize only.
